<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>ホースパーク競馬場</title>
<style>
:root{--bg:#0e1a14;--card:#16261d;--card2:#1d3226;--line:#2f503e;--txt:#eef6ef;--sub:#a3beac;--acc:#ffd23f;--grn:#4ade80;--red:#ff5d5d;--blue:#5aa9ff;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1410;color:var(--txt);font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic","Meiryo",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* HUD */
#hudL{position:fixed;left:calc(10px + var(--sal));top:calc(8px + var(--sat));display:flex;flex-direction:column;gap:5px;z-index:10;pointer-events:none;max-width:60vw}
#hudR{position:fixed;right:calc(10px + var(--sar));top:calc(8px + var(--sat));display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:10;max-width:46vw}
.chip{background:rgba(10,24,17,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:5px 10px;font-size:13px;display:flex;align-items:center;gap:6px;width:fit-content;line-height:1.3}
.chip b{font-size:17px;font-variant-numeric:tabular-nums;color:var(--acc)}
.chip small{color:var(--sub)}
#phaseChip{font-weight:700}
#phaseChip.bet{border-color:#3ddc84;color:#b8ffd4}
#phaseChip.gate{border-color:#ff8a65;color:#ffd0c0}
#phaseChip.race{border-color:#ff5252;color:#ffc9c9}
#phaseChip.res{border-color:#ffd23f;color:#fff0b0}
.rb{background:rgba(10,24,17,.78);border:1px solid rgba(255,255,255,.14);border-radius:50%;width:38px;height:38px;font-size:17px;display:grid;place-items:center;padding:0}
#rank{background:rgba(10,24,17,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:6px 8px;min-width:150px;pointer-events:none}
#rank .rt{font-size:11px;color:var(--sub);margin-bottom:3px}
.rk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:1.5px 0;white-space:nowrap}
.rk .n{width:19px;height:19px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:11px;border:1px solid rgba(255,255,255,.4);flex:none}
.rk .p{width:14px;color:var(--sub);font-size:11px;text-align:right;flex:none}
.rk .nm{overflow:hidden;text-overflow:ellipsis;max-width:92px}
.rk .g{margin-left:auto;color:var(--sub);font-size:11px;font-variant-numeric:tabular-nums;padding-left:4px}
.rk.my .nm{color:var(--acc);font-weight:700}

/* 実況・トースト */
#cast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--sab));max-width:min(92vw,720px);z-index:10;background:rgba(10,10,18,.8);border:1px solid rgba(255,255,255,.18);border-left:4px solid var(--acc);border-radius:10px;padding:8px 14px;font-size:15px;font-weight:700;pointer-events:none;text-align:center}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(56px + var(--sat));z-index:25;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92vw}
.toast{background:rgba(10,24,17,.92);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-size:14px;animation:tin .25s ease-out,tout .4s ease-in 2.6s forwards;max-width:520px;text-align:center}
.toast.good{border-color:#3ddc84;color:#c8ffdf}.toast.bad{border-color:#ff7a7a;color:#ffd0d0}.toast.gold{border-color:var(--acc);color:#fff1b0}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}
.pop{position:fixed;z-index:26;font-weight:800;font-size:22px;pointer-events:none;text-shadow:0 2px 6px rgba(0,0,0,.6);animation:popu 1.5s ease-out forwards}
.pop.plus{color:#7dffb0}.pop.minus{color:#ff8a8a}
@keyframes popu{from{opacity:1;transform:translateY(0) scale(1.1)}to{opacity:0;transform:translateY(-46px) scale(1)}}
.float{position:fixed;z-index:12;font-weight:900;font-size:26px;color:#fff;text-shadow:0 2px 0 #c62828,0 0 8px rgba(255,255,255,.6);pointer-events:none;animation:flo 1.6s ease-out forwards}
@keyframes flo{from{opacity:1;transform:translateY(0) rotate(-4deg)}to{opacity:0;transform:translateY(-90px) rotate(5deg)}}

/* 操作ボタン */
#actBtn{position:fixed;right:calc(14px + var(--sar));bottom:calc(18px + var(--sab));z-index:12;background:linear-gradient(#ffe07a,#ffc107);color:#3a2a00;border:0;border-radius:18px;padding:12px 18px;font-weight:800;font-size:16px;box-shadow:0 4px 0 #a37800,0 8px 18px rgba(0,0,0,.4);max-width:70vw;display:flex;align-items:center;gap:8px}
#actBtn:active{transform:translateY(2px);box-shadow:0 2px 0 #a37800}
#actBtn kbd{background:rgba(0,0,0,.2);border-radius:6px;padding:1px 7px;font-size:13px;font-family:inherit}
#seatBar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + var(--sab));z-index:12;display:flex;gap:8px}
#seatBar button{white-space:nowrap;background:rgba(10,24,17,.85);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:11px 14px;font-weight:700;font-size:14px}
#seatBar #sbCheer{background:linear-gradient(#ff8a80,#e53935);border-color:#ffb4ab}
#joyZone{position:fixed;left:0;bottom:0;width:55vw;height:62vh;z-index:5;touch-action:none}
#joyBase{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);z-index:6;display:none;pointer-events:none}
#joyKnob{position:absolute;left:36px;top:36px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55)}
#keyHint{position:fixed;left:calc(10px + var(--sal));bottom:calc(10px + var(--sab));z-index:9;font-size:12px;color:rgba(255,255,255,.7);background:rgba(10,24,17,.6);padding:4px 10px;border-radius:10px;pointer-events:none}
@media (pointer:coarse){#keyHint{display:none}}

/* 結果カード */
#result{position:fixed;left:50%;transform:translateX(-50%);top:calc(118px + var(--sat));z-index:15;width:min(94vw,430px);max-height:calc(100vh - 200px);overflow:auto;background:rgba(14,28,20,.96);border:2px solid var(--acc);border-radius:16px;padding:12px 14px;box-shadow:0 10px 40px rgba(0,0,0,.5);touch-action:pan-y}
#result h3{margin:0 0 6px;font-size:16px;display:flex;justify-content:space-between;align-items:center}
#result .x{background:none;border:0;font-size:18px;padding:0 4px;color:var(--sub)}
.ro{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:14px}
.ro .rn{width:20px;color:var(--sub);text-align:right;font-size:12px}
.ro .t{margin-left:auto;color:var(--sub);font-size:12px;font-variant-numeric:tabular-nums}
.ro.w .nm{color:var(--acc);font-weight:800}
.chipn{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-weight:800;font-size:12px;border:1px solid rgba(255,255,255,.45);flex:none}
.tk{display:flex;align-items:center;gap:6px;font-size:13px;padding:5px 8px;border-radius:9px;background:var(--card2);margin-top:4px;border:1px solid var(--line)}
.tk.hit{border-color:#3ddc84;background:#173a27}.tk.miss{opacity:.8}
.tk .r{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.net{margin-top:8px;text-align:center;font-size:18px;font-weight:800;padding:8px;border-radius:10px;background:#0c1812}
.net.plus{color:#7dffb0}.net.minus{color:#ff9a9a}

/* パネル */
#panel{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:calc(10px + var(--sat)) 10px calc(10px + var(--sab))}
#panel .sheet{width:min(100%,760px);max-height:100%;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:linear-gradient(#1d3b2b,#142a1f);border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:17px}
#pClose{background:rgba(255,255,255,.1);border:0;border-radius:50%;width:34px;height:34px;font-size:16px}
#pBody{overflow:auto;padding:12px 12px 16px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.rinfo{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-bottom:10px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13px}
.pill.st{margin-left:auto;font-weight:800}
.pill.st.open{color:#7dffb0;border-color:#3ddc84}.pill.st.shut{color:#ffb4a0;border-color:#ff8a65}
.hrow{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:6px;position:relative}
.hrow.canpick{cursor:pointer}.hrow.canpick:active{filter:brightness(1.2)}
.hrow.sel{outline:2px solid var(--acc);background:#2c4128}
.post{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:900;border:2px solid rgba(255,255,255,.5);font-size:15px}
.hname{font-weight:800;font-size:15px;display:flex;flex-wrap:wrap;align-items:center;gap:3px 8px}
.sty{font-size:11px;font-weight:700;padding:1px 7px;border-radius:8px;background:#0d1812;border:1px solid var(--line)}
.sty.nige{color:#ff9aa2}.sty.senko{color:#ffd27a}.sty.sashi{color:#8fe3a8}.sty.oikomi{color:#9ec5ff}
.cnd{font-size:12px;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{padding:1px 7px;border-radius:9px;background:#0d1812;border:1px solid var(--line);color:var(--sub);font-size:11.5px;white-space:nowrap}
.tag.f1{color:#7dffb0;border-color:#3ddc84}.tag.f2{color:#c9f7a0;border-color:#8bc34a}.tag.f3{color:#cfd8dc}.tag.f4{color:#ff9a9a;border-color:#ff6b6b}
.tag.on{color:#fff;border-color:var(--acc)}
.note{font-size:11.5px;color:#87a592;margin-top:3px}
.odds{text-align:right;font-variant-numeric:tabular-nums;line-height:1.35;min-width:62px}
.odds b{font-size:18px;color:var(--acc)}
.odds .sub{font-size:12px;color:var(--sub)}
.sbadge{position:absolute;right:8px;top:-8px;background:var(--acc);color:#222;border-radius:999px;font-weight:900;font-size:12px;padding:1px 8px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0 6px}
.seg button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-weight:700;font-size:14px}
.seg button.on{background:#38561f;border-color:var(--acc);color:#fff7cc}
.bdesc{font-size:12.5px;color:var(--sub);margin:2px 2px 8px}
.pk{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px;min-height:44px}
.pk .slot{display:flex;align-items:center;gap:5px;font-size:13px}
.pk .slot i{font-style:normal;color:var(--sub);font-size:12px}
.pk .empty{width:24px;height:24px;border-radius:50%;border:1.5px dashed var(--sub)}
.pk .est{margin-left:auto;text-align:right;font-size:13px;color:var(--sub)}
.pk .est b{color:var(--acc);font-size:16px}
.amt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.amt button{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-weight:700;font-size:13px}
.amt button.on{border-color:var(--acc);background:#38561f}
.stepper{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.stepper button{width:40px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:800}
.stepper .v{flex:1;text-align:center;font-weight:800;font-size:20px;color:var(--acc);font-variant-numeric:tabular-nums}
.buy{width:100%;padding:14px;border-radius:14px;border:0;font-weight:900;font-size:17px;background:linear-gradient(#5be38c,#1fb35a);color:#052a14;box-shadow:0 4px 0 #0f7a3a}
.buy:disabled{background:#3a4a40;color:#8aa090;box-shadow:none}
.buy:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 #0f7a3a}
.sec{font-size:13px;color:var(--sub);margin:14px 2px 4px;font-weight:700}
.hint{font-size:12.5px;color:#cfe3d4;background:#10281c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.sk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.sk.eq{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sk canvas{width:96px;height:96px;background:radial-gradient(#3a5b46,#1c3226);border-radius:12px}
.sk .nm{font-weight:800;font-size:13.5px;margin:6px 0 2px}
.sk .pr{color:var(--acc);font-weight:800;font-size:14px;margin-bottom:6px}
.sk button{width:100%;padding:8px;border-radius:10px;border:0;font-weight:800;font-size:13.5px;background:#2e7d32;color:#fff}
.sk button.dis{background:#3a4a40;color:#9bb0a2}
.sk button.use{background:#1565c0}
.sk button.on{background:#6d5600;color:#ffe9a8}

/* イントロ */
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(#1e4a33,#0a1912);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto;touch-action:pan-y}
#intro .card{width:min(100%,540px);background:rgba(10,24,17,.9);border:1px solid var(--line);border-radius:20px;padding:20px 20px 18px;text-align:center}
#intro h1{margin:0 0 4px;font-size:28px;letter-spacing:.04em}
#intro h1 span{color:var(--acc)}
#intro p{margin:6px 0;color:var(--sub);font-size:14px;line-height:1.7}
#intro ul{text-align:left;margin:10px auto;padding:0 0 0 20px;font-size:13.5px;line-height:1.9;color:#dcebe0}
#intro .go{margin-top:10px;padding:14px 38px;border-radius:16px;border:0;font-weight:900;font-size:19px;background:linear-gradient(#ffe07a,#ffc107);color:#3a2a00;box-shadow:0 5px 0 #a37800}
#intro .ctl{font-size:12.5px;color:#9ab3a2;margin-top:12px;line-height:1.7}
@media (max-width:560px){
  #hudL{max-width:54vw;gap:4px}.chip{font-size:12px;padding:4px 8px}.chip b{font-size:15px}
  #raceChip{flex-wrap:wrap}
  #rank{min-width:122px;padding:5px 6px}.rk{font-size:11.5px;gap:4px}.rk .nm{max-width:64px}
  #seatBar button{padding:10px 11px;font-size:13px}
  #cast{font-size:13.5px;bottom:calc(72px + var(--sab))}
  .hname{font-size:14px}
}
#intro input{width:100%;max-width:300px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#0c1812;color:var(--txt);font:inherit;font-size:16px;text-align:center;margin:6px 0;user-select:text;-webkit-user-select:text}
#intro .two{display:flex;gap:8px;justify-content:center;margin-top:12px}
#intro .go2{padding:10px 16px;border-radius:12px;border:1px solid var(--acc);background:#1d3226;font-weight:800;font-size:15px}
#joinRow{display:flex;gap:8px;justify-content:center;margin-top:8px;align-items:center}#joinRow input{max-width:150px;text-transform:uppercase;letter-spacing:.25em;margin:0}
#netMsg{margin-top:10px;font-size:13px;color:#ffb4a0;min-height:18px;line-height:1.5}
#plList{flex-direction:column;align-items:flex-start;gap:1px;font-size:12px}
#roomChip b{font-size:15px;letter-spacing:.15em}
.rkb{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;font-weight:900;font-size:13px;color:#10201a;margin-right:2px}
.skl{margin-top:4px;display:flex;flex-direction:column;gap:2px}
.skt{font-size:11.5px;color:#d7e9dc}.skt b{color:#ffd23f}.skt i{font-style:normal;color:#8fb09a;margin-left:4px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="joyZone"></div><div id="joyBase"><div id="joyKnob"></div></div>

<div id="hudL">
  <div class="chip"><span>💴</span><b id="money">¥10,000</b><small id="tkInfo"></small></div>
  <div class="chip" id="raceChip"></div>
  <div class="chip" id="phaseChip"></div>
  <div class="chip hidden" id="roomChip"></div>
  <div class="chip hidden" id="plList"></div>
</div>
<div id="hudR">
  <button class="rb" id="muteBtn" aria-label="音">🔊</button>
  <div id="rank" class="hidden"></div>
</div>
<div id="cast" class="hidden"></div>
<div id="toasts"></div>
<div id="keyHint">移動: WASD / 矢印キー　決定: E　走る: Shift</div>
<button id="actBtn" class="hidden"></button>
<div id="seatBar" class="hidden">
  <button id="sbStand">🚶 立つ</button>
  <button id="sbView">🎥 視点切替</button>
  <button id="sbCheer">📣 応援！</button>
</div>
<div id="result" class="hidden"></div>
<div id="panel" class="hidden"><div class="sheet"><div class="ph"><h2 id="pTitle"></h2><button id="pClose" aria-label="閉じる">✕</button></div><div id="pBody"></div></div></div>
<div id="intro">
  <div class="card">
    <h1>🏇 <span>ホースパーク</span>競馬場</h1>
    <p>コース場を歩いて、馬券を買って、観客席でレースを楽しもう。</p>
    <ul>
      <li>🎫 <b>馬券売り場</b>で馬券を購入（単勝・複勝・馬連・三連単）</li>
      <li>💺 <b>観客席</b>に座ると、実況ビューでレースを間近で観戦</li>
      <li>👕 <b>ショップ</b>でスキンを買ってお着替え</li>
      <li>🌡️ 馬ごとに<b>脚質・今日の調子・得意な気温と天気</b>が違う。出走表をよく読もう</li>
    </ul>
    <input id="nameIn" maxlength="10" placeholder="なまえ（ニックネーム）" autocomplete="off">
    <button class="go" id="goBtn">ひとりで遊ぶ</button>
    <div class="two"><button class="go2" id="hostBtn">👥 部屋を作る</button><button class="go2" id="joinBtn">🚪 部屋に入る</button></div>
    <div id="joinRow" class="hidden"><input id="codeIn" maxlength="4" placeholder="部屋コード" autocomplete="off"><button class="go2" id="joinGo">入る</button></div>
    <div id="netMsg"></div>
    <div class="ctl">PC: WASD/矢印で移動・Eで決定・Shiftでダッシュ<br>スマホ: 画面の左側をなぞって移動・右下ボタンで決定</div>
  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
/* ===================== ユーティリティ ===================== */
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const round1 = v => Math.round(v * 10) / 10;
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }

/* ===================== マスターデータ ===================== */
const WX = {
  sun:   { name: '晴れ', icon: '☀️' },
  cloud: { name: '曇り', icon: '☁️' },
  rain:  { name: '雨',   icon: '🌧️' },
  snow:  { name: '雪',   icon: '❄️' },
};
const GOING = {
  good:  { name: '良',   mul: 1.000, drain: 1.00 },
  yield: { name: '稍重', mul: 0.994, drain: 1.04 },
  heavy: { name: '重',   mul: 0.988, drain: 1.08 },

/* ===================== 馬の適性 ===================== */
const SPREAD = 0.14;
const STYLE_ADJ = { nige: 0.9975, senko: 0.9996, sashi: 1.0010, oikomi: 1.0016 };   // 脚質ごとの有利不利を打ち消す微調整
function tempMulOf(h, T) { const d = Math.abs(T - h.temp) * h.sens / 14; return 1 + 0.015 - 0.048 * Math.min(d, 1.4); }
function wxMulOf(h, w) { return w === h.fav ? 1.012 : (w === h.bad ? 0.97 : 1); }
/* pub=true: 一般のファンが見ている「やや鈍い」評価(オッズ用)。気温/天気の相性は半分以下しか織り込まれない */
function staticMul(e, R, pub) {
  const ac = pub ? 0.7 : 1, at = pub ? 0.5 : 1;
  const raw = e.h.pw * (1 + (e.cond.mul - 1) * ac) * (1 + (tempMulOf(e.h, R.temp) - 1) * at) * (1 + (wxMulOf(e.h, R.wx) - 1) * at);
  return 1 + (raw - 1) * SPREAD;   // 能力差を圧縮して接戦にする
}

/* ===================== レース・シミュレーション ===================== */
function mkState(e, R, pub) {
  return {
    i: e.i, post: e.post, e, style: e.h.style, sta: e.h.sta,
    d: 0, v: 0, en: 1, t: 0, fin: false, ft: 0, afterFin: 0,
    mul: staticMul(e, R, pub) * (1 + gauss() * 0.0065),
    namp: e.h.moody * 2.4 * (0.8 + Math.random() * 0.5),
    f1: rnd(.25, .5), f2: rnd(.5, .9), f3: rnd(.9, 1.6),
    p1: rnd(0, 6.28), p2: rnd(0, 6.28), p3: rnd(0, 6.28),
    ph: rnd(0, 6.28),
    sk: e.h.skills.map(k => ({ k, last: 0, done: false })), bt: 0, bm: 0, fxName: '', fxT: 0, evq: null,
  };
}
function stepHorse(s, R, dt) {
  s.t += dt;
  if (s.fin) {                                  // ゴール後はゆっくり減速
    s.afterFin += dt;
    const vt = Math.max(0, R.v0 * 0.9 * (1 - s.afterFin / 3.2));
    s.v += (vt - s.v) * Math.min(1, dt * 2.5);
    s.d += s.v * dt;
    return;
  }
  /* スキル抽選 */
  if (s.fxT > 0) s.fxT -= dt;
  if (s.bt > 0) { s.bt -= dt; if (s.bt <= 0) s.bm = 0; }
  for (const z of s.sk) {
    const k = z.k; let go = false;
    if (k.every) { const m = Math.floor(s.d / k.every); while (z.last < m) { z.last++; if (Math.random() < k.p) go = true; } }
    else if (!z.done) {
      const th = k.at === 'start' ? 8 : k.at === 'mid' ? R.D * 0.5 : R.D - 400;
      if (s.d >= th) { z.done = true; if (Math.random() < k.p) go = true; }
    }
    if (go) {
      if (k.fx === 'boost') { s.bm = Math.max(s.bm, k.mag); s.bt = Math.max(s.bt, k.dur); } else s.en = Math.min(1, s.en + k.mag);
      s.fxName = k.n; s.fxT = 1.4; if (s.evq) s.evq.push(k.n);
    }
  }
  const p = Math.min(1, s.d / R.D);
  let sm = STYLE_TAB[s.style][Math.round(p * 100)];
  if (sm > 1) sm = 1 + (sm - 1) * clamp(s.en / 0.22, 0.45, 1);   // 末脚はスタミナ残量しだい
  const fat = s.en > 0.12 ? 1 : 0.9 + 0.1 * (s.en / 0.12);               // ガス欠
  const nz = 1 + s.namp * (Math.sin(s.f1 * s.t + s.p1) + 0.7 * Math.sin(s.f2 * s.t + s.p2) + 0.5 * Math.sin(s.f3 * s.t + s.p3)) / 2.2;
  const vt = R.v0 * s.mul * STYLE_ADJ[s.style] * sm * fat * nz * R.trackMul * (1 + s.bm);
  const k = 1 - Math.exp(-dt * (s.d < 30 ? 2.2 : 3.0));
  s.v += (vt - s.v) * k;
  s.d += s.v * dt;
  s.en = Math.max(0, s.en - (0.75 / R.T) * Math.pow(s.v / R.v0, 3.5) / s.sta * R.drainMul * dt);
}

/* ===================== オッズ(モンテカルロ) ===================== */
function computeOdds(R, N) {
  N = N || (typeof ODDS_N !== 'undefined' ? ODDS_N : 260);
  const n = R.entries.length, wins = new Array(n).fill(0), top3 = new Array(n).fill(0);
  const dt = 0.1;
  for (let k = 0; k < N; k++) {
    const st = R.entries.map(e => mkState(e, R, true));
    let t = 0, fin = 0;
    while (fin < n && t < R.T * 2.2) {
      t += dt;
      for (const s of st) {
        if (s.fin) continue;
        const pd = s.d; stepHorse(s, R, dt);
        if (s.d >= R.D) { s.fin = true; s.ft = t - dt + dt * (R.D - pd) / (s.d - pd); fin++; }
      }
    }
    const order = st.slice().sort((a, b) => (a.fin ? a.ft : 1e9 - a.d) - (b.fin ? b.ft : 1e9 - b.d));
    wins[order[0].i]++;
    for (let j = 0; j < 3; j++) top3[order[j].i]++;
  }
  let sw = 0; const pw = wins.map(w => { const p = (w + 0.8) / (N + 0.8 * n); sw += p; return p; }).map(p => p / sw);
  const pp = top3.map(c => clamp((c + 1.5) / (N + 3), 0.02, 0.98));
  return {
    pw, pp,
    win: pw.map(p => clamp(round1(BET_TYPES[0].ret / p), 1.1, 199.9)),
    place: pp.map(p => clamp(round1(BET_TYPES[1].ret / p), 1.1, 49.9)),
  };
}
function oddsFor(R, type, picks) {
  const O = R.odds, p = O.pw;
  if (type === 'win') return O.win[picks[0]];
  if (type === 'place') return O.place[picks[0]];
  if (type === 'quin') {
    const i = picks[0], j = picks[1];
    const q = p[i] * p[j] / (1 - p[i]) + p[j] * p[i] / (1 - p[j]);
    return clamp(round1(BET_TYPES[2].ret / q), 1.5, 999.9);
  }
  const i = picks[0], j = picks[1], k = picks[2];
  const q = p[i] * p[j] / (1 - p[i]) * p[k] / (1 - p[i] - p[j]);
  return clamp(round1(BET_TYPES[3].ret / q), 5, 9999.9);
}

/* ===================== レース生成 ===================== */
function makeRace(no) {
  const temp = Math.round(clamp(17 + gauss() * 9, -2, 36));
  const r = Math.random();
  let wx;
  if (temp <= 2) wx = r < .45 ? 'snow' : (r < .75 ? 'cloud' : 'sun');
  else wx = r < .45 ? 'sun' : (r < .75 ? 'cloud' : 'rain');
  const D = pick([1200, 1600, 2000]);
  const going = wx === 'rain' ? pick(['yield', 'heavy']) : (wx === 'snow' ? 'bad' : 'good');
  const T = { 1200: 28, 1600: 37, 2000: 46 }[D];
  const pool = HORSES.slice(), hs = [];
  while (hs.length < 8) {   // ランクが高いほど出走しにくい(重み付き抽選)
    let tot = 0; for (const h of pool) tot += RANK_W[h.rank];
    let r2 = Math.random() * tot, k = 0; for (; k < pool.length - 1; k++) { r2 -= RANK_W[pool[k].rank]; if (r2 <= 0) break; }
    hs.push(pool.splice(k, 1)[0]);
  }
  shuffle(hs);
  const entries = hs.map((h, i) => {
    const e = { i, post: i + 1, h, cond: pickCond() };
    e.fit = (tempMulOf(h, temp) - 1) + (wxMulOf(h, wx) - 1);
    e.fitSym = e.fit >= 0.015 ? '◎' : e.fit >= 0.002 ? '○' : e.fit >= -0.02 ? '△' : '✕';
    return e;
  });
  const R = { no, D, T, v0: D / T, temp, wx, going, trackMul: GOING[going].mul, drainMul: GOING[going].drain, entries };
  R.odds = computeOdds(R);
  return R;
}

function rr(c, x, y, w, h, r) {

  for (let i = 0; i < n; i++) FX.push({ x: Math.random() * W, y: -10 - Math.random() * H * .3, vx: rnd(-40, 40), vy: rnd(120, 320), r: rnd(3, 7), c: pick(['#ffd23f', '#ff5d5d', '#4ade80', '#5aa9ff', '#ff7eb6', '#fff']), a: rnd(0, 6), va: rnd(-8, 8), life: rnd(2.2, 3.6) });
}
let castHideAt = 0;
function say(text, dur) {
  const el = $('#cast'); if (!text) { el.classList.add('hidden'); return; }
  el.textContent = text; el.classList.remove('hidden'); castHideAt = G.clock + (dur || 4.5);
}
function cheer() {
  if (!G.seat) return; G.cheering = 1.2; SFX.cheer();
  const R = G.race, mine = R && G.tickets.length ? G.tickets[0].picks[0] : null;
  const txt = (mine != null && R.phase === 'racing') ? `${R.entries[mine].post}番 がんばれー！` : pick(['いけーっ！', 'がんばれー！', '差せーっ！', '逃げ切れーっ！', 'うおおお！']);
  const el = document.createElement('div'); el.className = 'float'; el.textContent = txt; el.style.left = (W * rnd(.15, .6)) + 'px'; el.style.top = (H * rnd(.5, .75)) + 'px'; document.body.appendChild(el); setTimeout(() => el.remove(), 1600);
  if (G.online) netSend({ t: 'cheer', name: G.myName, txt });
}

/* ===================== レース進行 ===================== */
function initRaceState(R) {
  R.states = R.entries.map(e => { const s = mkState(e, R, false); s.evq = []; return s; });
  R.evts = []; R.cam = 12; R.t = 0; R.acc = 0; R.finOrder = []; R.afterAll = 0; R.order = null; R.cmt = {}; R.rank = R.states.slice(); R.leaderIdx = -1;
  R.phase = 'betting'; R.gateVisible = true; R.viewM = 50; R.zoomK = 1;
}
function randomSkin() {
  const sh = ['#e57373', '#64b5f6', '#fff176', '#81c784', '#ba68c8', '#ffffff', '#ffb74d', '#4dd0e1', '#f06292', '#a1887f', '#90a4ae'];
  const pa = ['#37474f', '#5d4037', '#283593', '#455a64', '#2e7d32', '#6d4c41', '#212121'];
  const ha = ['#222', '#4a2c1a', '#8a5a2b', '#bbb', '#d6a35c', '#111'];
  const sk = ['#ffd9b5', '#f2c29b', '#e0a982', '#c98d63'];
  const o = { shirt: pick(sh), pants: pick(pa), hair: pick(ha), skin: pick(sk) };
  const r = Math.random();
  if (r < .22) { o.hat = 'cap'; o.hatColor = pick(['#e03131', '#1971c2', '#2f9e44', '#f08c00']); } else if (r < .3) { o.hat = 'hunting'; o.hatColor = '#7a5a3a'; o.pencil = true; } else if (r < .34) { o.hat = 'bowler'; o.hatColor = '#222'; }
  return o;
}
function rerollSeats() {
  const taken = new Set(Object.values(G.remote).map(r => r.seat));
  for (const s of SEATS) s.npc = ((G.seat && G.seat.id === s.id) || taken.has(s.id)) ? null : (Math.random() < .42 ? randomSkin() : null);
}
function startBetting() {
  G.raceNo++; const R = G.nextRace || makeRace(G.raceNo); R.no = G.raceNo; G.nextRace = null;
  beginRace(R);
}
function beginRace(R) {
  G.race = R; initRaceState(R);
  G.tickets = []; G.myPicks = new Set(); UI.bet.picks = []; G.phase = 'betting'; G.timer = BET_TIME; R.phase = 'betting';
  $('#result').classList.add('hidden'); $('#rank').classList.add('hidden'); say(null);
  rerollSeats();
  if (G.money < 100) { G.money += 2000; popMoney(2000); toast('係員さんがお小遣いをくれた！ +¥2,000', 'gold'); }
  say(`第${R.no}レース 発売開始！ ${R.D}m・${WX[R.wx].name}・${R.temp}℃`, 5);
  save(); refreshPanel(); SFX.bell();
  if (NET.mode === 'host') bcast({ t: 'race', race: serializeRace(R), timer: G.timer });
}
function toPhase(p) {
  const R = G.race; G.phase = p; R.phase = p;
  if (NET.mode === 'host' && (p === 'gate' || p === 'racing')) bcast({ t: 'phase', p, timer: p === 'gate' ? GATE_TIME : 0 }); R.gateVisible = (p === 'betting' || p === 'gate');
  if (p === 'gate') { G.timer = GATE_TIME; SFX.gate(); say('投票を締め切りました。各馬ゲートイン…', 4); refreshPanel(); }
  if (p === 'racing') { R.t = 0; R.acc = 0; SFX.start(); say('スタートしました！ 各馬いっせいに飛び出します！', 4); $('#rank').classList.remove('hidden'); if (UI.panel === 'bet') closePanel(); }
}
function stepRace(dt) {
  const R = G.race; R.t += dt;
  for (const s of R.states) {
    const pd = s.d; stepHorse(s, R, dt);
    if (s.evq.length) { for (const n of s.evq) R.evts.push([s.i, n]); s.evq.length = 0; }
    if (!s.fin && s.d >= R.D) { s.fin = true; s.ft = R.t - dt + dt * (R.D - pd) / (s.d - pd); R.finOrder.push(s.i); }
  }
  if (R.finOrder.length >= R.states.length || R.t > R.T * 2.5) {
    for (const s of R.states) if (!s.fin) { s.fin = true; s.ft = R.t + (R.D - s.d) / 20; R.finOrder.push(s.i); }
    R.afterAll += dt; if (R.afterAll > 2.4) finishRace();
  }
}
function updateRanking() {
  const R = G.race; if (!R || !R.states) return;
  R.rank = R.states.slice().sort((a, b) => (a.fin && b.fin) ? a.ft - b.ft : (a.fin ? -1 : b.fin ? 1 : b.d - a.d));
  R.leaderIdx = R.phase === 'betting' || R.phase === 'gate' ? -1 : R.rank[0].i;
}
function updateCast() {
  const R = G.race; if (!R || R.phase !== 'racing') return;
  const rk = R.rank, lead = rk[0], c = R.cmt, left = R.D - lead.d, p = lead.d / R.D;
  const nm = s => `${s.post}番${s.e.h.name}`;
  if (R.finOrder.length === 1 && !c.goal) { c.goal = 1; say(`ゴール！ 1着は ${nm(R.states[R.finOrder[0]])}！`, 5); SFX.goal(); return; }
  if (R.finOrder.length) return;
  if (p > 0.1 && !c.lead1) { c.lead1 = 1; c.lastLead = lead.i; say(`先頭は ${nm(lead)}、${rk[1].post}番${rk[1].e.h.name}が続きます。`); }
  else if (c.lastLead != null && lead.i !== c.lastLead && p > 0.14 && G.clock - (c.lastChange || 0) > 3.5 && left > 90) { c.lastChange = G.clock; c.lastLead = lead.i; say(`先頭が替わった！ ${nm(lead)}！`, 3.5); }
  else if (left < R.D * 0.5 && !c.half) { c.half = 1; say(`レースは後半へ。先頭は ${nm(lead)}。`); }
  else if (left < 420 && !c.l400) { c.l400 = 1; say(`最後の直線に入る！ 先頭は ${nm(lead)}！`); }
  else if (left < 220 && !c.l200) {
    c.l200 = 1; const ch = rk.slice(2).sort((a, b) => b.v - a.v)[0] || rk[1];
    say(`残り200メートル！ 外から ${nm(ch)} が猛追！`, 3.5);
  }
}
function finishRace() {
  const R = G.race;
  R.order = R.states.slice().sort((a, b) => a.ft - b.ft).map(s => s.i);
  if (NET.mode === 'host') bcast({ t: 'finish', order: R.order, fts: R.states.map(s => s.ft) });
  applyFinish();
}
function applyFinish() {
  const R = G.race;
  settle(); toPhase('result'); G.timer = RESULT_TIME; R.phase = 'result';
  if (NET.mode !== 'guest') setTimeout(() => { if (G.phase === 'result' && !G.nextRace) G.nextRace = makeRace(G.raceNo + 1); }, 1800);
  showResult(); save();
}
function ticketText(t, R) {
  const bt = BET_TYPES.find(b => b.id === t.type);
  return bt.name + ' ' + t.picks.map(i => R.entries[i].post + '番').join(t.type === 'quin' ? '-' : '→');
}
function settle() {
  const R = G.race, o = R.order; let total = 0, stake = 0, hits = 0;
  for (const t of G.tickets) {
    let hit = false;
    if (t.type === 'win') hit = t.picks[0] === o[0];
    else if (t.type === 'place') hit = o.slice(0, 3).includes(t.picks[0]);
    else if (t.type === 'quin') hit = (t.picks[0] === o[0] && t.picks[1] === o[1]) || (t.picks[0] === o[1] && t.picks[1] === o[0]);
    else hit = t.picks[0] === o[0] && t.picks[1] === o[1] && t.picks[2] === o[2];
    t.hit = hit; t.pay = hit ? Math.floor(t.amount * t.odds / 10) * 10 : 0;
    total += t.pay; stake += t.amount; if (hit) hits++;
  }
  G.money += total;
  R.settle = { total, stake, hits, net: total - stake };
  if (G.tickets.length) { G.stats.played++; G.stats.hits += hits ? 1 : 0; G.stats.best = Math.max(G.stats.best, total); G.stats.net += total - stake; }
  if (total > 0) { popMoney(total); SFX.win(); confetti(total >= stake * 5 ? 160 : 80); toast(`的中！ 払戻 ${yen(total)}`, 'gold'); }
  else if (G.tickets.length) { SFX.lose(); }
}
function showResult() {
  const R = G.race, el = $('#result'); let h = `<h3><span>🏁 第${R.no}R 結果　<small style="color:var(--sub);font-weight:400">${R.D}m ${WX[R.wx].icon}${R.temp}℃</small></span><button class="x" data-act="rclose">✕</button></h3>`;
  R.order.forEach((i, k) => {
    const e = R.entries[i], s = R.states[i];
    h += `<div class="ro ${k === 0 ? 'w' : ''}"><span class="rn">${k + 1}着</span><span class="chipn" style="background:${POST_COL[e.post - 1]};color:${POST_TXT[e.post - 1]}">${e.post}</span><span class="nm">${e.h.name}</span><span class="t">${fmtTime(s.ft)}</span></div>`;
  });
  if (G.tickets.length) {
    h += '<div class="sec">あなたの馬券</div>';
    for (const t of G.tickets) h += `<div class="tk ${t.hit ? 'hit' : 'miss'}"><span>${t.hit ? '🎉' : '✕'}</span><span>${ticketText(t, R)}</span><small style="color:var(--sub)">${yen(t.amount)}×${t.odds}</small><span class="r">${t.hit ? '+' + yen(t.pay) : '−'}</span></div>`;
    const n = R.settle.net; h += `<div class="net ${n >= 0 ? 'plus' : 'minus'}">収支 ${n >= 0 ? '+' : '−'}${yen(Math.abs(n))}</div>`;
  } else h += '<div class="hint">次のレースは馬券売り場で馬券を買ってみよう！</div>';
  el.innerHTML = h; el.classList.remove('hidden');
}

/* ===================== 馬券 ===================== */
function curBT() { return BET_TYPES.find(b => b.id === UI.bet.type); }
function canBuy() {
  const R = G.race, b = UI.bet, bt = curBT();
  if (G.phase !== 'betting' || G.timer < 0.6) return '発売締切';
  if (b.picks.length !== bt.n) return `馬を${bt.n}頭えらぼう`;
  if (b.amount < 100) return '100円から';
  if (b.amount > G.money) return '所持金が足りない';
  return '';
}
function buyTicket() {
  const why = canBuy(); if (why) { toast(why, 'bad'); return; }
  const R = G.race, b = UI.bet, bt = curBT(), odds = oddsFor(R, b.type, b.picks);
  G.money -= b.amount; G.tickets.push({ type: b.type, picks: b.picks.slice(), amount: b.amount, odds });
  b.picks.forEach(i => G.myPicks.add(i)); popMoney(-b.amount); SFX.buy(); save();
  toast(`${ticketText(G.tickets[G.tickets.length - 1], R)} を ${yen(b.amount)} 購入！`, 'good');
  b.picks = []; if (b.amount > G.money) b.amount = Math.max(100, Math.floor(G.money / 100) * 100);
  renderPanel();
}

pBody.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return; audioInit();
  const a = el.dataset.act, b = UI.bet, R = G.race;
  if (a === 'pick') {
    if (!UI.buy || G.phase !== 'betting') return; const i = +el.dataset.i, bt = curBT(); SFX.click();
    const at = b.picks.indexOf(i);
    if (bt.n === 1) b.picks = [i];
    else if (bt.id === 'quin') { if (at >= 0) b.picks.splice(at, 1); else { b.picks.push(i); if (b.picks.length > 2) b.picks.shift(); } }
    else { if (at >= 0) b.picks.splice(at, 1); else if (b.picks.length >= 3) b.picks = [i]; else b.picks.push(i); }
    renderPanel();
  } else if (a === 'type') { b.type = el.dataset.t; b.picks = []; SFX.click(); renderPanel(); }
  else if (a === 'amt') { const v = el.dataset.v; b.amount = v === 'all' ? Math.max(100, Math.floor(G.money / 100) * 100) : +v; SFX.click(); renderPanel(); }
  else if (a === 'step') { b.amount = clamp(b.amount + (+el.dataset.d), 100, Math.max(100, Math.floor(G.money / 100) * 100)); SFX.click(); renderPanel(); }
  else if (a === 'buy') buyTicket();
  else if (a === 'skbuy') { const s = SKIN_BY_ID[el.dataset.id]; if (G.money >= s.price && !G.owned[s.id]) { G.money -= s.price; G.owned[s.id] = true; G.skin = s.id; popMoney(-s.price); SFX.equip(); toast(`${s.name} を購入して着替えた！`, 'gold'); save(); renderPanel(); } }
  else if (a === 'skuse') { G.skin = el.dataset.id; SFX.equip(); toast('お着替え完了！', 'good'); save(); renderPanel(); }
});

/* ===================== ワールド・操作 ===================== */
function blocked(x, y) {
  if (x < 30 || x > WORLD.w - 30 || y < 40 || y > WORLD.h - 18) return true;
  if (inTrackZone(x, y, 52)) return true;
  for (const o of OBS_RECTS) if (x > o.x - 9 && x < o.x + o.w + 9 && y > o.y - 4 && y < o.y + o.h + 9) return true;
  for (const c of OBS_CIRCS) if (Math.hypot(x - c.x, y - c.y) < c.r + 9) return true;
  for (const t of TREES) if (Math.hypot(x - t.x, y - t.y) < 12) return true;
  return false;
}

function hostData(c, d) {
  if (!d || !d.t) return;
  if (d.t === 'me' || d.t === 'hello') { setRemote(c.peer, d.t === 'hello' ? { name: d.name || 'ゲスト', x: 1100, y: 1240, dir: 'down', ph: 0, mv: false, skin: 'default', seat: null, money: 0 } : d); }
  else if (d.t === 'cheer') { bcast(d, c); showCheer(d.name, d.txt); }
}
function dropConn(c) {
  NET.conns = NET.conns.filter(x => x !== c); const r = G.remote[c.peer];
  if (r) { toast(`${r.name} さんが退室しました`); delete G.remote[c.peer]; }
}
function guestData(d) {
  if (!d || !d.t) return;
  if (d.t === 'welcome' || d.t === 'race') {
    const R = deserializeRace(d.race); G.raceNo = R.no; beginRace(R);
    if (d.t === 'welcome') {
      startGame(); G.online = true; netMsg('');
      if (d.phase !== 'betting') {
        G.phase = d.phase; R.phase = d.phase; R.gateVisible = d.phase === 'gate'; G.timer = d.timer;
        if (d.phase === 'racing') $('#rank').classList.remove('hidden');
        if (d.phase === 'result') { R.states.forEach((s, i) => { s.d = R.D; s.fin = true; s.ft = d.fts ? d.fts[i] : 0; s.afterFin = 9; }); R.order = d.order || R.states.map(s => s.i); R.finOrder = R.order.slice(); }
      } else G.timer = d.timer;
    } else G.timer = d.timer || BET_TIME;
  } else if (d.t === 'phase') { if (G.phase === 'betting' || G.phase === 'gate') { toPhase(d.p); if (d.p === 'gate') G.timer = d.timer; } }
  else if (d.t === 'snap') {
    const R = G.race; if (G.phase !== 'racing') return;
    R.states.forEach((s, i) => { if (s.fin) return; const df = d.d[i] - s.d; if (Math.abs(df) > 10) s.d = d.d[i]; else s.d += df * 0.5; s.v = d.v[i]; });
    for (const e of d.ev) { const s = R.states[e[0]]; if (s) { s.fxName = e[1]; s.fxT = 1.4; s.bt = 1.4; } }
  } else if (d.t === 'finish') {
    const R = G.race; if (!R || G.phase === 'result') return;
    R.states.forEach((s, i) => { s.fin = true; s.ft = d.fts[i]; s.afterFin = 0; });
    R.order = d.order.slice(); R.finOrder = d.order.slice(); updateRanking(); applyFinish();
  } else if (d.t === 'players') {
    const seen = new Set();
    for (const p of d.list) { if (p.id === NET.myId) continue; seen.add(p.id); setRemote(p.id, p); }
    for (const id of Object.keys(G.remote)) if (!seen.has(id)) { toast(`${G.remote[id].name} さんが退室しました`); delete G.remote[id]; }
  } else if (d.t === 'cheer') showCheer(d.name, d.txt);
}
function readName() { const v = $('#nameIn').value.trim().slice(0, 10); G.myName = v || ('ゲスト' + rint(10, 99)); }
function netFail(t) { netMsg(t); try { if (NET.peer) NET.peer.destroy(); } catch (e) { } NET.peer = null; NET.mode = 'solo'; $('#hostBtn').disabled = $('#joinGo').disabled = false; }
function hostRoom(tries) {
  const code = genCode(); let opened = false, peer;
  try { peer = new Peer('horsepark-' + code); } catch (e) { return netFail('PeerJSを開始できませんでした'); }
  NET.peer = peer;
  const to = setTimeout(() => { if (!opened) netFail('シグナリングサーバーに接続できません。この環境では外部通信がブロックされている可能性があります（HTMLを自分のサーバーやローカルで開いてください）。'); }, 12000);
  peer.on('open', () => { opened = true; clearTimeout(to); NET.mode = 'host'; NET.code = code; NET.myId = 'host'; G.online = true; netMsg(''); startGame(); toast(`部屋を作成しました。コード ${code} を友だちに伝えよう`, 'gold'); });
  peer.on('connection', c => {
    c.on('open', () => { NET.conns.push(c); c.send(welcomeMsg()); });
    c.on('data', d => hostData(c, d)); c.on('close', () => dropConn(c)); c.on('error', () => dropConn(c));
  });
  peer.on('error', err => {
    if (!opened && err.type === 'unavailable-id' && tries < 5) { clearTimeout(to); try { peer.destroy(); } catch (e) { } return hostRoom(tries + 1); }
    if (!opened) { clearTimeout(to); netFail('接続エラー: ' + err.type); } else toast('通信エラー: ' + err.type, 'bad');
  });
}
function joinRoom(code) {
  let opened = false, peer;
  try { peer = new Peer(); } catch (e) { return netFail('PeerJSを開始できませんでした'); }
  NET.peer = peer; NET.mode = 'guest'; NET.code = code;
  const to = setTimeout(() => { if (!opened) netFail('部屋に接続できませんでした（コードの間違い・ホスト不在・外部通信のブロックの可能性）。'); }, 15000);
  peer.on('open', id => {
    NET.myId = id; const c = peer.connect('horsepark-' + code, { reliable: true }); NET.hostConn = c;
    c.on('open', () => { opened = true; clearTimeout(to); c.send({ t: 'hello', name: G.myName }); });
    c.on('data', guestData);
    c.on('close', () => { if (NET.mode === 'guest') { toast('ホストとの接続が切れました。ひとり遊びに戻ります', 'bad'); NET.mode = 'solo'; G.online = false; G.remote = {}; G.nextRace = null; } });
  });
  peer.on('error', err => { if (!opened) { clearTimeout(to); netFail(err.type === 'peer-unavailable' ? '部屋が見つかりません。コードを確認してください。' : '接続エラー: ' + err.type); } });
}
$('#goBtn').addEventListener('click', () => { readName(); startGame(); });
$('#hostBtn').addEventListener('click', () => { readName(); if (typeof Peer === 'undefined') return netMsg('PeerJSを読み込めませんでした（ネット接続を確認してください）。'); netMsg('部屋を作っています…'); $('#hostBtn').disabled = true; hostRoom(0); });
$('#joinBtn').addEventListener('click', () => { $('#joinRow').classList.toggle('hidden'); });
$('#joinGo').addEventListener('click', () => {
  readName(); const code = $('#codeIn').value.trim().toUpperCase();
  if (code.length !== 4) return netMsg('部屋コードは4文字です');
  if (typeof Peer === 'undefined') return netMsg('PeerJSを読み込めませんでした（ネット接続を確認してください）。');
  netMsg('部屋に接続しています…'); $('#joinGo').disabled = true; joinRoom(code);
});

/* ===================== 起動 ===================== */
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  try { update(dt); updateHud(dt); render(); } catch (e) { console.error(e); window.__err = String(e && e.stack || e); }
  requestAnimationFrame(frame);
}
G.race = makeRace(++G.raceNo); initRaceState(G.race); G.timer = 60; rerollSeats(); initNPCs(); initCoins();
if (G.money < 100) G.money = 3000;
window.__g = { NET, bcast, serializeRace, deserializeRace, guestData, hostData, welcomeMsg, setRemote, G, UI, P, update, updateHud, render, stepRace, cheer, sitDown, standUp, openPanel, closePanel, buyTicket, SEATS, SPOTS, toPhase, finishRace, startBetting, doInteract, findNear, SKINS };
requestAnimationFrame(frame);

</script>
